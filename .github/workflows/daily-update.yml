name: Daily release update placeholder

on:
  schedule:
    - cron: '17 3 * * *' # Daily at 03:17 UTC; GitHub may delay scheduled runs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-release-update
  cancel-in-progress: false

jobs:
  validate-placeholder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run update:data
      - run: npm run check
      - name: Verify placeholder did not modify data
        run: git diff --exit-code -- public/data
      - name: Explain current status
        run: echo 'Validation completed. Collection is not configured; no data was fetched or changed.' >> "$GITHUB_STEP_SUMMARY"
