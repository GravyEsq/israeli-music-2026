name: Daily release discovery

on:
  schedule:
    - cron: '17 3 * * *' # Daily at 03:17 UTC; GitHub may delay scheduled runs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-discovery
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      failed: ${{ steps.collect.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Collect and verify
        id: collect
        continue-on-error: true
        run: npm run update:data
      - run: npm run check
      - name: Commit catalog and check status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/releases.json public/data/status.json data/pending-review.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified catalog and discovery status'
            git push origin HEAD:main
          fi
      - name: Run summary
        run: node scripts/update-summary.mjs >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
  report-failure:
    needs: [update, publish]
    if: always() && needs.update.outputs.failed == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Source check failed. The last verified catalog was preserved.'
          exit 1
